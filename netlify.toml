[build]
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/api/create-order"
  to = "/.netlify/functions/create-order"
  status = 200

[[redirects]]
  from = "/api/create-razorpay-order"
  to = "/.netlify/functions/create-razorpay-order"
  status = 200

[[redirects]]
  from = "/api/verify-payment"
  to = "/.netlify/functions/verify-payment"
  status = 200

[[redirects]]
  from = "/api/kimi-chat"
  to = "/.netlify/functions/kimi-chat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
